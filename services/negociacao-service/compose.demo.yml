name: negociacao-demo

x-app: &app
  build: .
  environment:
    DATABASE_URL: postgresql://svc_negociacao:negociacao_demo_app@db:5432/portal_b2b
    KAFKA_BOOTSTRAP_SERVERS: broker:9092
    KAFKA_GROUP_ID: negociacao-service-v1
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8106/health/ready', timeout=2)"]
    interval: 2s
    timeout: 3s
    retries: 30
  depends_on:
    migrar:
      condition: service_completed_successfully
    topicos:
      condition: service_completed_successfully

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: portal_b2b
      POSTGRES_USER: demo_admin
      POSTGRES_PASSWORD: negociacao_demo_admin
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./demo/init.sql:/docker-entrypoint-initdb.d/01-negociacao.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "demo_admin", "-d", "portal_b2b"]
      interval: 2s
      timeout: 2s
      retries: 20

  broker:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.8
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=512M
      - --kafka-addr=0.0.0.0:9092
      - --advertise-kafka-addr=broker:9092
      - --set
      - redpanda.auto_create_topics_enabled=false
    volumes:
      - rpdata:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info", "-X", "brokers=broker:9092"]
      interval: 2s
      timeout: 3s
      retries: 30

  topicos:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.8
    entrypoint: ["sh", "-ec"]
    command:
      - |
        for topic in leilao_iniciado modo_negociacao_definido pedido_atualizado pedido_temporario_solicitado lance_realizado negociacao_fechada negociacao.dlt; do
          rpk topic describe "$$topic" -X brokers=broker:9092 >/dev/null 2>&1 ||
          rpk topic create "$$topic" -p 3 -r 1 -X brokers=broker:9092
        done
    depends_on:
      broker:
        condition: service_healthy

  migrar:
    build: .
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment:
      MIGRATION_DATABASE_URL: postgresql://portal_ddl:negociacao_demo_ddl@db:5432/portal_b2b
    depends_on:
      db:
        condition: service_healthy

  app1:
    <<: *app

  app2:
    <<: *app

  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./demo/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${NEGOCIACAO_HTTP_PORT:-18106}:8080"
    depends_on:
      app1:
        condition: service_healthy
        restart: true
      app2:
        condition: service_healthy
        restart: true

volumes:
  pgdata:
  rpdata:
