x-negociacao: &negociacao
  build:
    context: ${NEGOCIACAO_PROJECT_DIR:?Indique o caminho absoluto de negociacao}
  environment:
    DATABASE_URL: ${DATABASE_URL:?Informe a DSN de svc_negociacao}
    KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-rp-0:9092,rp-1:9092,rp-2:9092}
    KAFKA_GROUP_ID: ${KAFKA_GROUP_ID:-negociacao-service-v1}
    JWKS_URL: ${JWKS_URL:?Informe a URL interna de JWKS}
    JWT_ISSUER: ${JWT_ISSUER:-identity-service}
    JWT_AUDIENCE: ${JWT_AUDIENCE:-b2b-platform}
    APP_PORT: ${APP_PORT:-8106}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
  networks: [portal-net]

services:
  app1-negociacao:
    <<: *negociacao
  app2-negociacao:
    <<: *negociacao
  negociacao-migrate:
    build:
      context: ${NEGOCIACAO_PROJECT_DIR:?Indique o caminho absoluto de negociacao}
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment:
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?Informe a DSN da role portal_ddl}
    networks: [portal-net]
