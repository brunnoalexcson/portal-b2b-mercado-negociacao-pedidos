# Override do Compose do kit:
#   docker compose -f docker-compose.yml -f <projeto>/services/mercado-service/compose.mercado.yml up -d
x-mercado-build: &mercado-build
  context: ${MERCADO_PROJECT_DIR:?Indique o caminho absoluto de services/mercado-service}
  target: runtime

x-mercado: &mercado
  build: *mercado-build
  environment:
    DATABASE_URL: ${MERCADO_DATABASE_URL:?Informe a DSN de svc_mercado}
    KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-rp-0:9092,rp-1:9092,rp-2:9092}
    KAFKA_GROUP_ID: ${KAFKA_GROUP_ID:-mercado-service-v1}
    JWKS_URL: ${JWKS_URL:-http://gateway:8080/.well-known/jwks.json}
    JWT_ISSUER: ${JWT_ISSUER:-identity-service}
    JWT_AUDIENCE: ${JWT_AUDIENCE:-b2b-platform}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    EXCESSO_DEMANDA_MINIMO_PERCENTUAL: ${EXCESSO_DEMANDA_MINIMO_PERCENTUAL:-0}
    LEILAO_JANELA_ADESAO_MINUTOS: ${LEILAO_JANELA_ADESAO_MINUTOS:-60}
    LEILAO_DURACAO_HORAS: ${LEILAO_DURACAO_HORAS:-24}
    LEILAO_INCREMENTO_MINIMO_PERCENTUAL: ${LEILAO_INCREMENTO_MINIMO_PERCENTUAL:-1}
  depends_on:
    mercado-migrate:
      condition: service_completed_successfully
  networks: [portal-net]

services:
  app1-mercado:
    <<: *mercado
  app2-mercado:
    <<: *mercado
  mercado-migrate:
    build: *mercado-build
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment:
      MIGRATION_DATABASE_URL: ${MERCADO_MIGRATION_DATABASE_URL:?Informe a DSN de portal_ddl}
    depends_on:
      - pg-primary
    networks: [portal-net]
